name: Pipeline DevSecOps CIB-204

# Se ejecuta en cada push y en cada pull request a main, y a mano desde Actions.
on:
  push:
    branches: ["main", "inseguro", "solucion"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Permisos minimos: solo lectura de contenidos (CodeQL corre via default setup).
permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1) SAST con Semgrep  ->  detecta eval(), inyeccion SQL/comandos, JWT, CORS
  # ==========================================================================
  sast_semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijo: supply chain)
      - name: Ejecutar Semgrep
        # [FIX-18] Alcance SAST acotado al codigo fuente de la app.
        #   --exclude 'docs/**': docs/ contiene EVIDENCIA (artefactos DAST ZAP,
        #   SBOM, reportes) no codigo de aplicacion; su contenido incluye links
        #   http://localhost (objetivo del DAST local) que generan falsos
        #   positivos plaintext-http-link. Se excluye del SAST igual que
        #   .semgrepignore (redundancia a prueba de version) y se documenta en
        #   docs/informe-maestro.md §12.x (FIX-18).
        # --error hace fallar el job si hay hallazgos; se guarda el SARIF.
        run: semgrep scan --config p/default --config p/javascript --config p/nodejs --exclude 'docs/**' --error --sarif --output semgrep.sarif .
      - name: Guardar reporte Semgrep
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA fijo: supply chain)
        with:
          name: reporte-semgrep
          path: semgrep.sarif

  # ==========================================================================
  # 2) SAST con CodeQL  ->  CUBIERTO POR DEFAULT SETUP DE GITHUB
  #    El job avanzado (github/codeql-action) NO puede coexistir con el
  #    default setup habilitado en Settings > Code security > Code scanning:
  #    "CodeQL analyses from advanced configurations cannot be processed when
  #    the default setup is enabled". El default setup corre el workflow
  #    "Run CodeQL" en cada push (ver informe §8.6, run 35386648439 en verde).
  # ==========================================================================

  # ==========================================================================
  # 3) Deteccion de secretos con Gitleaks  ->  .env, llave privada, claves AWS
  # ==========================================================================
  secretos:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijo: supply chain)
        with:
          fetch-depth: 0
      - name: Ejecutar Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --no-git -v \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Guardar reporte Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA fijo: supply chain)
        with:
          name: reporte-gitleaks
          path: gitleaks.sarif

  # ==========================================================================
  # 4) SCA - Analisis de dependencias  ->  npm audit + Trivy (sistema de archivos)
  # ==========================================================================
  sca:
    name: SCA - Dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijo: supply chain)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA fijo: supply chain)
        with:
          node-version: 20
      - name: npm audit (falla en severidad alta o critica)
        working-directory: servidor
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high
      - name: Trivy - dependencias (fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA fijo: supply chain)
        with:
          scan-type: fs
          scan-ref: servidor
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  # ==========================================================================
  # 5) Seguridad de la imagen  ->  Trivy (imagen) + SBOM con Syft
  # ==========================================================================
  imagen:
    name: Imagen - Trivy + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijo: supply chain)
      - name: Construir la imagen
        run: docker build -t cifrado:${{ github.sha }} ./servidor
      - name: Trivy - escaneo de imagen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA fijo: supply chain)
        with:
          scan-type: image
          image-ref: cifrado:${{ github.sha }}
          severity: HIGH,CRITICAL
          # [FIX-16] --ignore-unfixed: los CVEs de util-linux (CVE-2026-53613/
          # 76642/78408/78409/78410) no tienen version fija en ninguna distro
          # (afectan hasta 2.41.5); se documentan como riesgo residual en el
          # informe (§8.5). El resto de paquetes se actualiza en el Dockerfile.
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generar SBOM (Syft)
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0 (SHA fijo: supply chain)
        with:
          image: cifrado:${{ github.sha }}
          output-file: sbom.spdx.json
      - name: Guardar SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA fijo: supply chain)
        with:
          name: sbom
          path: sbom.spdx.json

  # ==========================================================================
  # 6) DAST - OWASP ZAP  ->  ataca la app en ejecucion (cabeceras, CORS, etc.)
  # ==========================================================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijo: supply chain)
      - name: Levantar el servicio
        run: |
          docker build -t cifrado ./servidor
          docker run -d -p 3000:3000 --name cifrado cifrado
          sleep 8
          curl -s http://localhost:3000/salud || true
      - name: OWASP ZAP Baseline (genera el informe)
        run: |
          mkdir -p "$PWD/zap" && chmod 777 "$PWD/zap"
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r informe_zap.html -a -I || true
      - name: Guardar informe ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA fijo: supply chain)
        with:
          name: reporte-zap
          path: zap/informe_zap.html
